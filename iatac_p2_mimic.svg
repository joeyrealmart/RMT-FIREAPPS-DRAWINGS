<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 1684" width="1190" height="1684">
  <style>
    .bg { fill: #0f172a; }
    .title-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
    .wall-outer { stroke: #38bdf8; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wall-inner { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .partition { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 2; fill: none; }
    .door { stroke: #38bdf8; stroke-width: 1.5; fill: none; }
    .door-arc { stroke: #38bdf8; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .room-fill { fill: #1e293b; fill-opacity: 0.6; }
    .void-fill { fill: #0f172a; fill-opacity: 0.8; stroke: #475569; stroke-dasharray: 6 3; }
    .stair-step { stroke: #64748b; stroke-width: 1.2; }
    .column { fill: #38bdf8; stroke: #0284c7; stroke-width: 1; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: bold; fill: #f8fafc; }
    .text-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .text-room { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; text-anchor: middle; }
    .text-room-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #cbd5e1; text-anchor: middle; }
    .legend-border { stroke: #475569; stroke-width: 1.5; fill: #1e293b; fill-opacity: 0.8; }
    .legend-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #e2e8f0; }
  </style>

  <!-- Background -->
  <rect class="bg" width="1190" height="1684" />

  <!-- Title Block Header -->
  <g id="title_block">
    <rect class="title-bg" x="50" y="40" width="1090" height="160" rx="6" />
    <text class="text-title" x="80" y="85">IATAC — PAGE 2</text>
    <text class="text-subtitle" x="80" y="112">CANDIDATE: lib-iatac-p2 | ARCHITECTURAL FLOORPLAN MIMIC</text>
    <text class="text-subtitle" x="80" y="132">AUTHORITATIVE SOURCE: page-002.png (SHA-256: FEDA216A7A982855707DA98F0D03EEF1C9E60E50E4941F969CE15B29F4A2F6CB)</text>
    <text class="text-subtitle" x="80" y="152">SITE: IATAC | FLOOR IDENTITY: First Floor / Page 2</text>
  </g>

  <!-- Floorplan Main Boundary Container -->
  <g id="architectural_geometry">

    <!-- Fills -->
    <rect class="room-fill" x="200" y="100" width="800" height="420" />
    <rect class="void-fill" x="250" y="520" width="700" height="260" />
    <rect class="room-fill" x="250" y="780" width="800" height="480" />

    <!-- Outer Structural Walls -->
    <path class="wall-outer" d="
      M 200,100 L 1000,100 L 1000,520 L 950,520 L 950,780 L 1050,780 L 1050,1260 L 250,1260 L 250,780 L 200,780 L 200,100 Z
    " />

    <!-- First Floor Upper Bay Partition Walls (Y=100-520) -->
    <path class="wall-inner" d="M 330,100 L 330,520" />
    <path class="wall-inner" d="M 440,100 L 440,520" />
    <path class="wall-inner" d="M 550,100 L 550,520" />
    <path class="wall-inner" d="M 660,100 L 660,520" />
    <path class="wall-inner" d="M 770,100 L 770,520" />
