      <text class="text-room" x="445" y="1025">1ST FL CORRIDOR</text>
      <text class="text-room" x="575" y="1025">MEETING ROOM</text>
      <text class="text-room" x="705" y="1025">RESTROOMS</text>
      <text class="text-room" x="835" y="1025">SERVER ROOM</text>
      <text class="text-room" x="975" y="1025">STAIR 2 CORE</text>

      <text class="text-room" x="315" y="1220">STAIRWELL 1</text>
      <text class="text-room" x="445" y="1185">STORE / ARCHIVE</text>
      <text class="text-room" x="575" y="1185">PANTRY</text>
