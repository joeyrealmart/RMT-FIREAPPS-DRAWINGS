      <text class="text-room" x="265" y="200">INSTRUCTOR 1</text>
      <text class="text-room" x="385" y="200">INSTRUCTOR 2</text>
      <text class="text-room" x="495" y="200">CHIEF FLYING</text>
      <text class="text-room-sub" x="495" y="215">INSTRUCTOR</text>
      <text class="text-room" x="605" y="200">EXAM ROOM</text>
