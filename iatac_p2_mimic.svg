    <path class="wall-inner" d="M 250,940 L 1050,940" />
    <path class="wall-inner" d="M 250,1110 L 1050,1110" />

    <path class="wall-inner" d="M 380,780 L 380,1260" />
    <path class="wall-inner" d="M 510,780 L 510,1260" />
    <path class="wall-inner" d="M 640,780 L 640,1260" />
    <path class="wall-inner" d="M 770,780 L 770,1260" />
