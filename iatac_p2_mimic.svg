    <rect class="column" x="660" y="100" width="16" height="16" />
    <rect class="column" x="880" y="100" width="16" height="16" />
    <rect class="column" x="1000" y="100" width="16" height="16" />

    <rect class="column" x="250" y="780" width="16" height="16" />
    <rect class="column" x="510" y="780" width="16" height="16" />
    <rect class="column" x="770" y="780" width="16" height="16" />
    <rect class="column" x="1050" y="780" width="16" height="16" />

