      <line class="stair-step" x1="260" y1="1135" x2="370" y2="1135" />
      <line class="stair-step" x1="260" y1="1150" x2="370" y2="1150" />
      <line class="stair-step" x1="260" y1="1165" x2="370" y2="1165" />
      <line class="stair-step" x1="260" y1="1180" x2="370" y2="1180" />
      <line class="stair-step" x1="260" y1="1195" x2="370" y2="1195" />

      <line class="stair-step" x1="910" y1="1120" x2="1040" y2="1120" />
      <line class="stair-step" x1="910" y1="1135" x2="1040" y2="1135" />
      <line class="stair-step" x1="910" y1="1150" x2="1040" y2="1150" />
      <line class="stair-step" x1="910" y1="1165" x2="1040" y2="1165" />
      <line class="stair-step" x1="910" y1="1180" x2="1040" y2="1180" />
      <line class="stair-step" x1="910" y1="1195" x2="1040" y2="1195" />
